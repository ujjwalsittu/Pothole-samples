# Production stack: Postgres + API + admin + Caddy (domains + auto-SSL).
#
#   cp .env.production.example .env.production   # fill in secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Point DNS A records for API_DOMAIN and ADMIN_DOMAIN at this host BEFORE
# starting — Caddy obtains (and auto-renews) Let's Encrypt certificates on
# boot. Changing VITE_/domain values requires rebuilding the admin image
# (build args are baked at build time):
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build admin

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: pothole
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.production}
      POSTGRES_DB: potholes
    volumes:
      - prod-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pothole -d potholes"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: postgres://pothole:${POSTGRES_PASSWORD}@db:5432/potholes
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_AUDIENCE: https://${API_DOMAIN:-api-potholes.threemates.in}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-PotholeCollect <no-reply@threemates.in>}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-ujjwal@threemates.tech}
      CORS_ORIGINS: https://${ADMIN_DOMAIN:-potholes.threemates.in}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_DIR: /data/uploads
      OSRM_DATA_DIR: /data/osrm
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - prod-media:/data

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_API_URL: https://${API_DOMAIN:-api-potholes.threemates.in}
        VITE_AUTH0_DOMAIN: ${AUTH0_DOMAIN}
        VITE_AUTH0_CLIENT_ID: ${AUTH0_SPA_CLIENT_ID}
        VITE_AUTH0_AUDIENCE: https://${API_DOMAIN:-api-potholes.threemates.in}
    restart: unless-stopped

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:-api-potholes.threemates.in}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-potholes.threemates.in}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-ujjwal@threemates.tech}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - prod-caddy-data:/data
      - prod-caddy-config:/config
    depends_on:
      - api
      - admin

volumes:
  prod-pgdata:
  prod-media:
  prod-caddy-data:
  prod-caddy-config:
