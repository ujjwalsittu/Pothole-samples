services:
  db:
    image: postgres:16
    container_name: pothole-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: potholes
    ports:
      - "5432:5432"
    volumes:
      - pothole-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d potholes"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pothole-pgdata:
